name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # On a desktop dbus-python and PyGObject come from the distribution;
      # here they are built for each Python against the system libraries
      # (libsecret through its GObject introspection data).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libglib2.0-dev libgirepository-2.0-dev libcairo2-dev \
            gir1.2-secret-1 \
            pkg-config git
      - name: Create the environment
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "dbus-python>=1.3,<2" "PyGObject>=3.48,<4"
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/python -m pytest -q
