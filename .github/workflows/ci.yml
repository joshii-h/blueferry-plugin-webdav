name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # dbus-python, PyGObject and libsecret come from the distribution, as
      # on a desktop; the venv sees them through --system-site-packages.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-dbus python3-gi gir1.2-secret-1 git
      - name: Create the environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/python -m pytest -q
